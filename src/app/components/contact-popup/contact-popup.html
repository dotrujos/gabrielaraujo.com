<div class="backdrop" (click)="close()">
  <section class="sheet" animate.enter="sheet-enter" (click)="$event.stopPropagation()">
    <header class="masthead">
      <span class="eyebrow">(CONTATO — 2026)</span>
      <button class="close" type="button" (click)="close()">FECHAR</button>
    </header>

    <h2 class="display">
      VAMOS
      <br />
      <span serifFont><i>conversar</i></span>
    </h2>

    <ul class="channels">
      @for (channel of channels; track channel.label; let i = $index) {
        <li>
          <a [href]="channel.href" target="_blank" rel="noopener noreferrer">
            <span class="index">0{{ i + 1 }}</span>
            <span class="label">{{ channel.label }}</span>
            <span class="value">{{ channel.value }}</span>
            <span class="arrow" aria-hidden="true">&#8599;</span>
          </a>
        </li>
      }
    </ul>

    <p class="colophon">ESCOLHA UM CANAL</p>
  </section>
</div>
